  let DATA = {};
  let currentCategory = "";
  let isAdminMode = false;

  // 初始化：★★★ 修改處：強制清除舊緩存，優先使用真實代碼數據 ★★★
  function initData() {
    // 1. 強制清除舊有的 localStorage，確保每次開啟都是乾淨的狀態
    try {
        localStorage.removeItem(STORAGE_KEY);
        console.log("Cache cleared per user request.");
    } catch(e) {
        console.warn("Unable to clear local storage:", e);
    }

    // 2. 直接載入原始資料
    // 我們使用 Deep copy 確保編輯時不會直接修改到 REAL_DATA_SOURCE 常數
    DATA = JSON.parse(JSON.stringify(REAL_DATA_SOURCE));
    
    // 3. 確保 currentCategory 有效
    const keys = Object.keys(DATA);
    if (!DATA[currentCategory] || !keys.includes(currentCategory)) {
      currentCategory = keys[0] || ""; 
    }

    // 4. ★★★ SEO 關鍵：動態生成 Google 結構化數據 ★★★
    generateJsonLd(DATA);
  }

  // 重置為原始真實資料
  function resetToSource() {
    DATA = JSON.parse(JSON.stringify(REAL_DATA_SOURCE)); 
    // 注意：因為現在預設就是不存 LocalStorage (除非使用者在本次 Session 有編輯)
    // 但為了讓編輯功能在「本次瀏覽」有效，我們還是可以暫存一下，或者單純更新記憶體
    saveData(); // 這裡的 save 只是更新到當前瀏覽器的記憶體狀態 (如果 initData 清除了，這裡 save 會重新建立，但在下次 F5 會再次被清除)
    renderCategories();
    renderCards(DATA[currentCategory]);
  }

  // 儲存至 LocalStorage (僅供本次 Session 暫存，下次重新整理會被 initData 清除)
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  }

  // ★★★ SEO Helper: 生成 JSON-LD 結構化數據 ★★★
  // 這會告訴 Google 這些是「課程列表」或「學習資源」
  function generateJsonLd(data) {
    const itemList = [];
    let position = 1;

    Object.keys(data).forEach(category => {
        data[category].forEach(item => {
            itemList.push({
                "@type": "ListItem",
                "position": position++,
                "item": {
                    "@type": "Course",
                    "name": item.title,
                    "description": item.desc || item.title,
                    "provider": {
                        "@type": "Organization",
                        "name": "Kao88",
                        "sameAs": "https://aifinsys.com/"
                    },
                    "url": item.url
                }
            });
        });
    });

    const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": itemList,
        "name": "KaoX.Ai 課程資源列表",
        "description": "包含量化交易、財經詞彙、AI教學工具等豐富資源。"
    };

    const script = document.createElement('script');
    script.type = "application/ld+json";
    script.text = JSON.stringify(schema);
    document.head.appendChild(script);
    console.log("SEO JSON-LD Generated.");
  }

     2. Rendering Logic
     ------------------------------------------- */
  const categoryListEl = document.getElementById('categoryList');
  const cardGridEl = document.getElementById('cardGrid');
  const categoryTitleEl = document.getElementById('categoryTitle');
  const adminPanelEl = document.getElementById('adminPanel');

  function renderCategories() {
    categoryListEl.innerHTML = '';
    Object.keys(DATA).forEach(cat => {
      const count = DATA[cat].length;
      const li = document.createElement('li');
      li.innerHTML = `<span>${cat}</span> <span class="badge">${count}</span>`;
      if (cat === currentCategory) li.classList.add('active');
      li.setAttribute('role', 'button');
      li.setAttribute('aria-label', `檢視 ${cat} 分類，共 ${count} 個項目`);
      
      li.addEventListener('click', () => {
        currentCategory = cat;
        document.getElementById('globalSearch').value = '';
        renderCategories();
        renderCards(DATA[cat]);
        if(window.innerWidth < 900) {
          li.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
      categoryListEl.appendChild(li);
    });
  }

  function renderCards(list, isSearchResult = false) {
    cardGridEl.innerHTML = '';
    if (!list) list = [];

    const titleText = isSearchResult 
      ? `搜尋結果（共 ${list.length} 項）` 
      : `${currentCategory || '未選擇分類'}（共 ${list.length} 項）`;
    categoryTitleEl.textContent = titleText;

    if (list.length === 0) {
      cardGridEl.innerHTML = `<div class="muted" style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">
        ${isSearchResult ? '找不到符合的資料。' : '此分類目前沒有項目。'}
        <br>${isAdminMode ? '請使用上方表單新增。' : (isSearchResult ? '' : '切換至「管理模式」可新增資料。')}
      </div>`;
      return;
    }

    list.forEach((item, index) => {
      const isUrl = item.thumb && (
        item.thumb.startsWith('http') ||
        item.thumb.startsWith('img/') ||
        item.thumb.startsWith('./img/') ||
        item.thumb.startsWith('data:image')
      );
      let imgHtml = '';
      if (isUrl) {
        imgHtml = `<img class="card-img" src="${item.thumb}" alt="${item.title} 縮圖" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <div class="card-img emoji-icon" style="display:none">📄</div>`;
      } else {
        imgHtml = `<div class="card-img emoji-icon">${item.thumb || '📄'}</div>`;
      }
      
      const card = document.createElement('div');
      card.className = 'card';
      
      const checkboxHtml = (!isSearchResult) 
        ? `<input type="checkbox" class="del-check" data-idx="${index}" aria-label="選取刪除">` 
        : '';

      const categoryTag = isSearchResult ? `<span style="font-size:0.75em; color:var(--primary); background:#eff6ff; padding:2px 6px; border-radius:4px; margin-left:6px;">${item.category}</span>` : '';

      card.innerHTML = `
        ${checkboxHtml}
        <div class="card-body">
          ${imgHtml}
          <div class="card-content">
            <h4>${item.title}${categoryTag}</h4>
            <p>${item.desc || '無描述'}</p>
          </div>
        </div>
        <div class="card-foot">
          <button class="btn primary" style="flex:1" onclick="window.open('${item.url}','_blank')">前往</button>
          <button class="btn ghost" onclick="copyToClipboard('${item.url}')">複製連結</button>
        </div>
      `;
      cardGridEl.appendChild(card);
    });
  }

  /* -------------------------------------------
     3. Interactions & Features
     ------------------------------------------- */
  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert('連結已複製！')).catch(err => prompt('請手動複製', text));
    } else {
      prompt('請手動複製', text);
    }
  }

  document.getElementById('globalSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      renderCategories();
      renderCards(DATA[currentCategory]);
      return;
    }
    let results = [];
    Object.keys(DATA).forEach(cat => {
      if(Array.isArray(DATA[cat])) {
        DATA[cat].forEach(item => {
          if ((item.title + item.desc).toLowerCase().includes(q)) {
            results.push({ ...item, category: cat });
          }
        });
      }
    });
    document.querySelectorAll('nav.side li').forEach(li => li.classList.remove('active'));
    renderCards(results, true);
  });

  document.getElementById('btnToggleAdmin').addEventListener('click', () => {
    isAdminMode = !isAdminMode;
    document.body.classList.toggle('admin-mode', isAdminMode);
    
    const btn = document.getElementById('btnToggleAdmin');
    if (isAdminMode) {
      btn.classList.add('active');
      btn.style.background = '#e0e7ff';
      btn.style.color = 'var(--primary)';
      adminPanelEl.classList.add('show');
      document.getElementById('globalSearch').value = '';
      renderCategories();
      renderCards(DATA[currentCategory]);
    } else {
      btn.classList.remove('active');
      btn.style.background = '';
      btn.style.color = '';
      adminPanelEl.classList.remove('show');
    }
  });

      desc: desc || '自訂新增項目',
      thumb: thumb
    });

    saveData();
    renderCategories();
    renderCards(DATA[currentCategory]);
    
    document.getElementById('newTitle').value = '';
    document.getElementById('newUrl').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newThumb').value = '';
  });

  document.getElementById('btnDeleteSelected').addEventListener('click', () => {
    const checks = document.querySelectorAll('.del-check:checked');
    if (checks.length === 0) {
      alert('請先勾選要刪除的卡片 (需在管理模式下)');
      return;
    }
    if (!confirm(`確定要刪除這 ${checks.length} 個項目嗎？`)) return;
    const indicesToDelete = Array.from(checks).map(c => parseInt(c.dataset.idx)).sort((a, b) => b - a);
    indicesToDelete.forEach(idx => {
      DATA[currentCategory].splice(idx, 1);
    });
    saveData();
    renderCategories();
    renderCards(DATA[currentCategory]);
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('確定要清除所有自訂資料，重置為系統原始完整資料嗎？')) {
      resetToSource();
      if(isAdminMode) document.getElementById('btnToggleAdmin').click();
    }
  });

  document.getElementById('btnExportHtml').addEventListener('click', () => {
    if (!confirm('即將生成獨立 HTML 檔案。\n該檔案已針對 Google AI Search 進行結構化數據優化。')) return;

    const currentDataJson = JSON.stringify(DATA, null, 2);
    let htmlContent = document.documentElement.outerHTML;

    htmlContent = htmlContent.replace(/<ul id="categoryList">[\s\S]*?<\/ul>/, '<ul id="categoryList"></ul>');
    htmlContent = htmlContent.replace(/<div id="cardGrid" class="grid">[\s\S]*?<\/div>/, '<div id="cardGrid" class="grid"></div>');
    htmlContent = htmlContent.replace(/class="[^"]*admin-mode[^"]*"/, '');
    htmlContent = htmlContent.replace(/id="adminPanel" class="[^"]*show[^"]*"/, 'id="adminPanel"');
    
    // 移除當前頁面生成的動態 script (避免重複堆疊)
    htmlContent = htmlContent.replace(/<script type="application\/ld\+json">[\s\S]*?<\/script>/, '');

    const dataRegex = /\/\* \[\[DATA_START\]\] \*\/[\s\S]*?\/\* \[\[DATA_END\]\] \*\//;
    const newDataBlock = `/* [[DATA_START]] */ ${currentDataJson} /* [[DATA_END]] */`;
    
    htmlContent = htmlContent.replace(dataRegex, newDataBlock);

    const blob = new Blob([htmlContent], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Kao88_課程資料_SEO版.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* -------------------------------------------
     4. Boot
     ------------------------------------------- */
  window.addEventListener('DOMContentLoaded', () => {
    initData();
    renderCategories();
    renderCards(DATA[currentCategory]);
  });
</script>
</body>
</html>
