<!DOCTYPE html>
<html lang="zh">
<head>

    <style>

            padding: 14px 20px;
            border-radius: 60px;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-weight: 500;
            color: #1b3a5e;
        }
        .stats span {
            background: white;
            padding: 2px 16px;
            border-radius: 30px;

        }

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f4970;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            background: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary {
            background: #1f4970;
            color: white;
            box-shadow: 0 4px 8px rgba(26, 67, 113, 0.2);
        }
        .btn-primary:hover {
            background: #123152;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b7cee5;
        }
        .btn-outline:hover {
            background: #dce8f5;
        }
        .btn-danger {
            background: #c72a2a;
            color: white;
        }
        .btn-danger:hover {
            background: #a02121;
        }

            margin-top: 6px;

        .question-item {

            margin-bottom: 18px;
            border: 1px solid #e3ecf7;

        }
        .question-item:hover {
            border-color: #b8d0e9;
            background: #fbfdff;
        }
        .q-header {
            display: flex;
            gap: 8px 12px;
            flex-wrap: wrap;
            align-items: baseline;
            margin-bottom: 12px;
        }
        .q-number {

            color: #004080;
            background: #dce8f5;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            line-height: 26px;
        }
        .q-text {
            font-weight: 500;
            font-size: 1.05rem;
            color: #102a44;
            line-height: 1.5;
            flex: 1;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px 12px;
            padding-left: 6px;
            margin: 10px 0 6px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8faff;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid #deeaf8;
            transition: 0.08s;
            cursor: pointer;
            font-size: 0.95rem;
            color: #1a334f;
        }
        .option-label:hover {
            background: #e6f0fd;
            border-color: #92b4db;
        }

            accent-color: #1f6bb0;
            width: 18px;
            height: 18px;
            margin: 0;
            flex-shrink: 0;
        }

            margin-top: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 6px 12px 6px 18px;
            border-radius: 50px;
            background: #f1f7fe;
        }
        .answer-feedback .result {
            font-weight: 600;
            padding: 2px 16px;
            border-radius: 30px;
        }
        .result.correct {
            background: #c3e6cb;
            color: #0a4b2a;
        }
        .result.wrong {
            background: #f8d7da;
            color: #9e2a2a;
        }
        .result.unanswered {
            background: #eaeef3;
            color: #385477;
        }
        .show-answer {
            background: transparent;
            border: none;
            color: #0066b3;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline dotted;
            padding: 0 4px;
        }
        .show-answer:hover {
            color: #003c73;
        }
        .correct-answer-text {
            color: #004d2b;
            font-weight: 500;
            background: #e3f0e6;
            padding: 0 16px;
            border-radius: 30px;

            .stats { justify-content: center; }
            .btn-group { justify-content: center; }
            .options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <div class="toolbar">
        <div class="stats">
            <span>✅ 已答 <span class="num" id="answeredCount">0</span></span>
            <span>🎯 正確 <span class="num" id="correctCount">0</span></span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="submitAllBtn">📤 提交全部</button>
            <button class="btn btn-outline" id="showAllAnswersBtn">👁️ 顯示答案</button>
            <button class="btn btn-danger" id="resetBtn">⟳ 重設</button>
        </div>
    </div>

    <div class="question-container" id="questionContainer"></div>

    <div class="footer-bar">
        <span style="color: #4e6d8c; font-size:0.9rem;">💡 點選選項即可作答 · 再次點擊可更改</span>
    </div>
</div>
<script>
    (function() {

            { id: 12, text: '(3) 十進制數 (60.875) 以二進制表示為何？', options: ['①110110.111', '②101110.110', '③111100.111', '④110100.110'], correct: 2 },
            { id: 13, text: '(3) 二進制數 1011 1001 1100 0011 以十六進制表示為何？', options: ['①C9E3', '②A9D3', '③B9C3', '④C8E4'], correct: 2 },
            { id: 14, text: '(1) 假設某一 CPU 共有 20 條位址線，請問可定址出之實體記憶空間為', options: ['①1MB', '②512KB', '③16MB', '④64KB'], correct: 0 },
            { id: 15, text: '(2) 下列兩個八進位數值之和為何？ (23.4) + (56.4) =', options: ['① (66.0)', '② (102.0)', '③ (79.8)', '④ (515.10)'], correct: 1 },

            { id: 22, text: '(1)「十進位數 77」等於「八進位數」的', options: ['①115', '②116', '③117', '④114'], correct: 0 },

            { id: 24, text: '(4)「十六進位數 1A1B」等於「八進位數」的', options: ['①977', '②6684', '③1123', '④15033'], correct: 3 },
            { id: 25, text: '(2)「十六進位數 F0」等於「二進位數」的', options: ['①00001111', '②11110000', '③11000011', '④00111100'], correct: 1 },
            { id: 26, text: '(1)「八進位數 123」等於「十進位數」的', options: ['①83', '②38', '③79', '④97'], correct: 0 },
            { id: 27, text: '(2) 1 個「八進位」的數字可由幾個「二進位」的數字組成', options: ['①2', '②3', '③4', '④5'], correct: 1 },

            { id: 29, text: '(2) 某辦公室內有數台電腦，將這些電腦以網路線與集線器 (Hub) 連接，此種連接方式為', options: ['①匯流排網路', '②星狀網路', '③環狀網路', '④網狀網路'], correct: 1 },

            { id: 40, text: '(1) 十進位的 29.5，若以十六進位表示，結果為何？', options: ['①1D.8', '②1D.9', '③1D.A', '④1D.B'], correct: 0 },

            { id: 62, text: '(3) 電腦硬體結構可分為五大單元，下列何者負責指令解碼的任務？', options: ['①輸入單元', '②算術邏輯單元', '③控制單元', '④記憶單元'], correct: 2 },
            { id: 63, text: '(4) 下列何者資料儲量最大？', options: ['①230 KB', '②220 MB', '③210 GB', '④10TB'], correct: 3 },
            { id: 64, text: '(2) 下列何者為甲＝（1E）16 、乙＝（72）8 、丙＝（11111）2 三個數值的大小關係？', options: ['①甲＝乙＝丙', '②乙＞丙＞甲', '③乙＞甲＞丙', '④甲＞乙＞丙'], correct: 1 },
            { id: 65, text: '(2) 一張點陣圖的影像大小為 800*1200 像素，若要列印為 4 英吋 6 英吋的照片，則此張影像的列印解析度應設定為多少像素/英吋？', options: ['①100', '②200', '③400', '④800'], correct: 1 },
            // ---------- 第二批新增 (共18題) ----------
            { id: 66, text: '(3) 下列何者不屬於資訊安全的威脅？', options: ['①天然災害', '②人為過失', '③取控制', '④機件故障'], correct: 2 },
            { id: 67, text: '(2) 下列何者屬於惡意破壞？', options: ['①人為怠慢', '②擅改資料內容', '③系統軟體有誤', '④系統操作錯誤'], correct: 1 },
            { id: 68, text: '(1) 在資訊安全的種類中，有關媒體出入管制項目，是屬於下列何者的重要項目之一？', options: ['①實體安全', '②資料安全', '③程式安全', '④系統安全'], correct: 0 },
            { id: 69, text: '(3) 下列何者不是資訊系統安全之措施？', options: ['①備份（Backup）', '②稽核（Audit）', '③測試（Testing ）', '④識別（Identification）'], correct: 2 },
            { id: 70, text: '(4) 一般資訊中心為確保電腦作業而採取各種防護的措施，而防護的項目有四項，下列哪一項不在這四項之內？', options: ['①實體', '②資料', '③系統', '④上機紀錄'], correct: 3 },
            { id: 71, text: '(3) 主要的硬體安全防護措失，下列何者錯誤？', options: ['①虛擬電腦系統（Virtual machine）', '②記憶體的保護', '③上線密碼（Login-Password）', '④核心設計（Kernel design ）'], correct: 2 },
            { id: 72, text: '(1) 對於「零時差攻擊（zero-day attack）」之敘述，下列何者正確？', options: ['①在軟體弱點被發現，但尚未有任何修補方法前所出現的對應攻擊行為', '②在午夜12點（零點）發動攻擊的一種病毒行為', '③弱點掃描與攻擊發生在同一天的一種攻擊行為', '④攻擊與修補發生在同一天的一種網路事件'], correct: 0 },
            { id: 73, text: '(1) 有關於「弱點」之敘述，下列何者錯誤？', options: ['①弱點是一種使用者操作上的錯誤或瑕疵', '②弱點在與暴露可能導致有心人士利用作為入侵途徑', '③弱點可能導致程式運作出現非預期結果而造成程式效能上的損失或進一步的權益損害', '④管理員若未能即時取得弱點資訊與修正檔將導致被入侵的可能性增加'], correct: 0 },
            { id: 74, text: '(3) 下列何者不是「虛擬私人網路（VPN，Virtual Private Network ）」採用的技術原理？', options: ['①穿隧技術', '②加解密技術', '③備援技術', '④使用者與設備身分鑑別技術'], correct: 2 },
            { id: 75, text: '(1) 下列哪一項攻擊無法藉由過濾輸入參數來防禦？', options: ['①Directory listing', '②SQL injection', '③Cross site scripting', '④Command injection'], correct: 0 },
            { id: 76, text: '(1) 在 ISMS 的稽核報告中，不滿足標準條款規定的，稱之為何？', options: ['①不符合事項（non-conformance ）', '②缺失事項（defect）', '③不足事項（deficient）', '④建議事項（recommend）'], correct: 0 },
            { id: 77, text: '(1) 下列何者不是「資料隱碼攻擊（SQL injection ）」的特性？', options: ['①為使用者而非開發程式者造成', '②造成資料庫資料遭竄改或外洩', '③主要原因為程式缺乏輸入驗證', '④可跳過驗證並入侵系統'], correct: 0 },
            { id: 78, text: '(2) 下列哪一項不屬於「社交工程攻擊」手法？', options: ['①郵件仿冒或偽裝', '②針對帳號密碼採行典攻擊法', '③網路釣魚', '④電話詐騙個人資訊'], correct: 1 },
            { id: 79, text: '(1) 下列哪一項區塊鏈技術之敘述錯誤？', options: ['①使用最少的資源來達到最安全的效果', '②仰賴多台網路主機來協助產生區塊', '③區塊是以被雜的加密和雜湊演算法來執行', '④每一項交易都需要進行資料認證'], correct: 0 },
            { id: 80, text: '(4) 下列何者不是入侵偵測與防禦系統（IDPS）的安全事件偵測方法？', options: ['①比對惡意攻擊的特徵', '②分析異常的網路活動', '③偵測異常的通訊協定狀態', '④確認使用者的權限'], correct: 3 },
            { id: 81, text: '(4) 公開金鑰密碼系統中，要讓資料傳送時以亂碼呈現，並且傳送者無法否認其傳送行為，需要使用哪兩個金鑰同時加密才能達成？', options: ['①傳送者及接收者的私鑰', '②傳送者及接收者的公鑰', '③接收者的私鑰及傳送者的公鑰', '④接收者的公鑰及傳送者的私鑰'], correct: 3 },
            { id: 82, text: '(3) 下列何者不是企業常用來防止駭客入侵內部網路的措施？', options: ['①定期更換使用者密碼', '②電腦加裝掃毒軟體且定期更新版本', '③定期進行資料備份', '④在內部網路與外部網路間建構防火牆'], correct: 2 },
            { id: 83, text: '(3) 使用防火牆有助於防範下列何種駭客的攻擊？', options: ['①零時差攻擊', '②網路釣魚', '③阻斷服務攻擊', '④邏輯炸彈'], correct: 2 },
            { id: 84, text: '(4) 下列何種觀念敘述不正確？', options: ['①使用防毒軟體仍需經常更新病毒碼', '②不可隨意開啟不明來源電子郵件的附加檔案', '③重要資料燒錄於光碟儲，可避免受病毒感染及破壞', '④將資料備份於不同的資料夾內，可確保資料安全'], correct: 3 }
        ];

        // ---------- state ----------
        let userAnswers = new Array(QUESTION_BANK.length).fill(null);   // 儲存所選 option index (0~3)
        let showAllAnswers = false;    // 是否顯示正確答案

        const container = document.getElementById('questionContainer');
        const totalSpan = document.getElementById('totalCount');
        const answeredSpan = document.getElementById('answeredCount');
        const correctSpan = document.getElementById('correctCount');

        function render() {
            let html = '';
            QUESTION_BANK.forEach((q, index) => {
                const selectedIdx = userAnswers[index];
                const isCorrect = (selectedIdx !== null && selectedIdx === q.correct);
                const hasAnswered = (selectedIdx !== null);
                // 顯示答案的標記
                let feedbackHtml = '';
                if (showAllAnswers || hasAnswered) {
                    let resultText = '';
                    let resultClass = 'unanswered';
                    if (hasAnswered) {
                        resultClass = isCorrect ? 'correct' : 'wrong';
                        resultText = isCorrect ? '✓ 正確' : '✗ 錯誤';
                    } else {
                        resultText = '未作答';
                    }
                    const correctOptionText = q.options[q.correct];
                    feedbackHtml = `
                        <div class="answer-feedback">
                            <span class="result ${resultClass}">${resultText}</span>
                            ${showAllAnswers ? `<span class="correct-answer-text">✅ 正確答案：${correctOptionText}</span>` : ''}
                            ${(!showAllAnswers && hasAnswered && !isCorrect) ? `<span class="correct-answer-text" style="background:#f0e6e6;color:#7a2a2a;">正確：${correctOptionText}</span>` : ''}
                        </div>
                    `;
                }

                html += `
                    <div class="question-item" data-qindex="${index}">
                        <div class="q-header">
                            <span class="q-number">${q.id}.</span>
                            <span class="q-text">${q.text}</span>
                        </div>
                        <div class="options">
                            ${q.options.map((opt, optIdx) => {
                                const checked = (selectedIdx === optIdx) ? 'checked' : '';
                                return `
                                    <label class="option-label">
                                        <input type="radio" name="q_${index}" value="${optIdx}" ${checked} data-index="${index}" data-optidx="${optIdx}">
                                        ${opt}
                                    </label>
                                `;
                            }).join('')}
                        </div>
                        ${feedbackHtml}
                    </div>
                `;
            });
            container.innerHTML = html;

            // 更新統計
            totalSpan.textContent = QUESTION_BANK.length;
            const answeredCount = userAnswers.filter(a => a !== null).length;
            answeredSpan.textContent = answeredCount;
            let correctCount = 0;
            for (let i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null && userAnswers[i] === QUESTION_BANK[i].correct) correctCount++;
            }
            correctSpan.textContent = correctCount;

            // 綁定事件 (radio change)
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function(e) {
                    const idx = parseInt(this.dataset.index, 10);
                    const optIdx = parseInt(this.dataset.optidx, 10);
                    if (this.checked) {
                        userAnswers[idx] = optIdx;
                    } else {
                        // 如果取消選中 (但radio不會自行取消，但我們可以防止，但保持一致性)
                    }
                    // 重新渲染 (保持狀態)
                    render();
                });
            });
        }

        // ---------- 按鈕功能 ----------
        document.getElementById('submitAllBtn').addEventListener('click', function() {
            // 強制顯示所有題目的正確/錯誤反饋 (即顯示答案)
            showAllAnswers = true;
            render();
        });

        document.getElementById('showAllAnswersBtn').addEventListener('click', function() {
            showAllAnswers = !showAllAnswers;  // toggle
            render();
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            userAnswers.fill(null);
            showAllAnswers = false;
            render();
        });

        // 初始渲染
        render();
    })();
</script>
</body>
</html>
